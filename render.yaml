# Render Blueprint — declares the API service so setup is reproducible rather
# than a dashboard click-path. Import it from the Render dashboard ("New +" →
# "Blueprint") and point it at this repo.
#
# The database is NOT declared here: Render's free Postgres expires, so Postgres
# lives on Neon (free permanently). Paste its connection string into DATABASE_URL
# when Render prompts for it.
services:
  - type: web
    name: frankly-api
    runtime: docker
    plan: free
    region: frankfurt
    # Context is backend/ because the Dockerfile copies pyproject.toml and uv.lock
    # from its own directory, the same as `docker build backend/` locally.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # Don't redeploy the API for frontend-only commits. Without this, a CSS tweak
    # restarts the live service and re-runs migrations for no reason.
    #
    # `backend/**` is exhaustive rather than a guess: dockerContext is ./backend,
    # so nothing outside that directory can change the image. render.yaml is
    # included because it defines the service itself. Filters apply only to
    # autodeploys — a manual deploy from the dashboard always works if this is
    # ever too narrow.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: ENV
        value: prod
      # Render generates a 256-bit secret; the app refuses to boot in prod on the
      # dev default, so this must be a real value.
      - key: SECRET_KEY
        generateValue: true
      # The billable AI features stay off in production. Both this and a real
      # ANTHROPIC_API_KEY are required before anything can call a model, and the
      # key is deliberately absent — see backend/app/features.py.
      # Quoted: unquoted `false` is a YAML boolean, and env vars are strings.
      - key: LLM_ENABLED
        value: "false"
      # *.onrender.com and *.vercel.app are different sites, so the refresh
      # cookie needs SameSite=None or the browser drops it and every reload
      # signs the user out. Switch to "lax" once a custom domain makes the app
      # and API same-site.
      - key: COOKIE_SAMESITE
        value: none
      # Prompted on first deploy: the Neon connection string.
      - key: DATABASE_URL
        sync: false
      # Prompted on first deploy: the Vercel URL(s), comma-separated.
      - key: FRONTEND_ORIGIN
        sync: false
      # Transactional email — the signup and password-reset codes.
      #
      # All three were set by hand on Render and declared nowhere, which is how
      # EMAIL_FROM sat on the shared throwaway sender for a whole release without
      # anyone noticing: no diff ever showed it. Config that cannot be read in a
      # review is config nobody reviews, so it lives here now.
      - key: EMAIL_PROVIDER
        value: resend
      # Set in the dashboard, not here — it is a secret. `sync: false` means the
      # blueprint leaves the existing value alone. Without a key the app logs
      # `email_disabled` at boot and degrades to the console sender rather than
      # refusing to serve budgets and transactions too.
      - key: EMAIL_API_KEY
        sync: false
      # The setting that decides who can RECEIVE mail, not just what the From
      # header reads — and the one that was wrong in production.
      #
      # It was `Frankly <onboarding@resend.dev>`, Resend's shared sender. That
      # needs no domain, but it delivers ONLY to the address on our own Resend
      # account and refuses every other recipient with 403 validation_error. So
      # signup worked for the person testing it and silently failed for everyone
      # else, which is the worst shape a bug can take.
      #
      # askfrankly.app is verified in Resend (eu-west-1, matching Render
      # frankfurt and Neon eu-central-1). Do not put the resend.dev sender back.
      - key: EMAIL_FROM
        value: "Frankly <noreply@askfrankly.app>"
