name: Send the weekly digest

# Hourly, not weekly — and that is the point. A weekly cron at a fixed UTC hour would
# send to everyone at the same instant regardless of where they are; the endpoint
# instead picks out whoever's *local* Monday morning has arrived. 167 of every 168 runs
# do one indexed query and find nobody.
#
# Free because this repo is public (public repos get unmetered Actions), and the API is
# awake anyway — keep-warm.yml pings it every ten minutes.
#
# Two things about GitHub's scheduler worth knowing rather than discovering:
#   * it is best-effort and skews under load, which is why the endpoint guards on "not
#     sent in six days" rather than on an exact hour;
#   * it disables scheduled workflows after 60 days with no push to the repo. A missing
#     keep-warm ping goes unnoticed; a missing digest does not.
#
# Setup:
#   gh secret set DIGEST_CRON_SECRET --body "$(openssl rand -base64 32)"
#   …then set the same value as CRON_SECRET on the Render service.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

# A slow run must never overlap the next hour's and double-send. The endpoint's claim
# makes that safe anyway; this stops it being tested in production every hour.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API to send what is due
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.DIGEST_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL variable or DIGEST_CRON_SECRET secret is not set — nothing to do."
            exit 0
          fi
          # Generous timeout: the first call of the hour may absorb a cold start.
          # No --retry: a retried POST is a second claim attempt, and while the endpoint
          # is idempotent by design, there is no reason to lean on that hourly.
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/digest/run"
