name: Keep the API awake

# Render's free tier sleeps a web service after 15 minutes idle, and waking it
# takes 30-60 seconds — long enough that a first-time visitor gives up. This
# pings /healthz often enough to keep it warm.
#
# A delayed or missed run is harmless: GitHub's scheduler is best-effort, and if
# the service does fall asleep, the next ping absorbs the cold start instead of a
# person doing it. Staying awake ~744 hours/month fits inside Render's 750 free
# instance-hours, but leaves little room for a second free service.
#
# Free to run because this repo is public (public repos get unmetered Actions).
# GitHub disables scheduled workflows after 60 days without a push to the repo.
#
# Setup — point it at the deployed API:
#   gh variable set API_URL --body https://frankly-api.onrender.com

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL repository variable is not set — nothing to ping yet."
            exit 0
          fi
          # Generous timeout: a cold start is the case we exist to absorb.
          curl -fsS --max-time 90 --retry 2 --retry-delay 15 "$API_URL/healthz"
